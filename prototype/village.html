<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>新手草原・3D 村莊原型｜寶可夢卡牌訓練營</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏡</text></svg>">
<link rel="stylesheet" href="../assets/css/style.css">
<style>
  html,body{height:100%;overflow:hidden;background:#BFE3FF}
  #world{position:fixed;inset:0;touch-action:none}
  #world canvas{display:block;width:100%;height:100%}
  .hud{position:fixed;left:0;right:0;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;pointer-events:none}
  .hud > *{pointer-events:auto}
  .zone-pill{
    font-family:'Noto Sans TC',var(--round);font-weight:900;font-size:22px;
    background:linear-gradient(180deg,#B9F0A8,#6BC25A);border:3px solid var(--ink);border-radius:16px;
    padding:4px 16px;box-shadow:0 5px 0 var(--ink),0 0 18px rgba(255,255,255,.7);color:var(--ink)
  }
  .hint{
    position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:10;
    background:rgba(31,42,92,.82);color:#fff;border-radius:14px;padding:6px 16px;font-size:15px;white-space:nowrap;
    transition:opacity .6s
  }
  .quality{position:fixed;right:14px;bottom:14px;z-index:11;font-size:14px;padding:6px 12px}
  /* 道館標籤（HTML 文字，保持清晰） */
  #tags{position:fixed;inset:0;z-index:5;pointer-events:none}
  .gym-tag{
    position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;
    display:flex;align-items:center;gap:8px;white-space:nowrap;
    background:#fff;border:3px solid var(--ink);border-radius:16px;padding:4px 12px 4px 4px;
    box-shadow:0 5px 0 var(--ink);font-family:inherit;font-size:17px;color:var(--ink);
    transform:translate(-50%,-100%);will-change:transform;transition:filter .2s
  }
  .gym-tag b{
    display:inline-flex;width:32px;height:32px;border-radius:50%;align-items:center;justify-content:center;
    background:var(--sun);border:3px solid var(--ink);font-family:'Noto Sans TC';font-weight:900;font-size:17px
  }
  .gym-tag i{font-style:normal;font-size:14px;letter-spacing:1px}
  .gym-tag.current{background:linear-gradient(180deg,#FFF6C8,#FFE066);animation:tagGlow 1.4s ease-in-out infinite}
  .gym-tag.locked{background:#E9E6DD;color:#6F6C62}
  .gym-tag.locked b{background:#D2CEC2}
  .gym-tag:hover{filter:brightness(1.08)}
  .gym-tag.nope{animation:nope .35s}
  @keyframes tagGlow{50%{box-shadow:0 5px 0 var(--ink),0 0 22px 8px rgba(255,230,128,.95)}}
  .loading{
    position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:radial-gradient(circle at 50% 40%,#E9F7FF,#9ED3FF);transition:opacity .8s
  }
  .loading .spin{width:64px;height:64px;border-radius:50%;border:6px solid #fff;border-top-color:var(--sun);animation:spin 1s linear infinite}
  .loading p{font-size:20px;margin:0}
  .fade{position:fixed;inset:0;z-index:25;background:#fff;opacity:0;pointer-events:none;transition:opacity .6s}
  @media (max-width:560px){ .zone-pill{font-size:18px} .gym-tag{font-size:15px} .hint{font-size:13px} }
</style>
</head>
<body>
<div id="world" aria-label="新手草原 3D 村莊地圖"></div>
<div id="tags"></div>

<div class="hud">
  <div style="display:flex;gap:10px;align-items:center">
    <a class="btn" href="../index.html" aria-label="回原本地圖">🗺</a>
    <span class="zone-pill">🌱 新手草原</span>
  </div>
  <span class="star-pill" aria-live="polite"></span>
</div>
<div class="hint" id="hint">拖曳可以轉動視角・滾輪或雙指縮放・點道館進入關卡</div>
<button class="btn quality" id="quality">畫質：高</button>
<div class="toast" id="toast" role="status"></div>
<div class="fade" id="fade"></div>
<div class="loading" id="loading"><div class="spin"></div><p>村莊建造中…</p></div>

<script>
  /* 載入檢查：資源缺少或出錯時顯示說明，不要一直轉圈 */
  (function(){
    function fail(msg){
      var L=document.getElementById('loading'); if(!L) return;
      L.innerHTML='<p style="font-size:22px;margin:0 0 8px">😵 村莊載入失敗</p><p style="max-width:420px;text-align:center;line-height:1.7;font-size:17px;margin:0 16px">'+msg+'</p>';
    }
    window.__villageFail = fail;
    window.addEventListener('error', function(e){
      if (e.target && (e.target.tagName==='SCRIPT' || e.target.tagName==='LINK')) fail('找不到網站的程式檔。請先把 zip「全部解壓縮」，再打開資料夾裡的 prototype/village.html；或改開 village-standalone.html。');
      else if (e.message) fail('發生錯誤：'+e.message+'<br>可以改開 village-standalone.html 試試看。');
    }, true);
    setTimeout(function(){ if(document.getElementById('loading') && !window.__villageOK) fail('等太久了。請確認已經解壓縮整個資料夾，或改開 village-standalone.html。'); }, 20000);
  })();
</script>
<script src="../assets/vendor/three.min.js"></script>
<script src="../assets/vendor/three-post.js"></script>
<script src="../assets/js/common.js"></script>
<script>
(() => {
  if (typeof THREE === 'undefined' || typeof PTCG === 'undefined') { window.__villageFail && __villageFail('找不到網站的程式檔。請先把 zip「全部解壓縮」，再打開資料夾裡的 prototype/village.html；或改開 village-standalone.html。'); return; }
  if (!document.createElement('canvas').getContext('webgl2') && !document.createElement('canvas').getContext('webgl')) { __villageFail('這個瀏覽器不支援 3D（WebGL）。請改用最新版的 Chrome、Edge 或 Safari。'); return; }
  const T = THREE;
  PTCG.starPill(document.querySelector('.star-pill'));

  /* ================= 基本設定 ================= */
  const host = document.getElementById('world');
  const renderer = new T.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  let DPR = Math.min(devicePixelRatio || 1, 1.75);
  renderer.setPixelRatio(DPR);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = T.PCFSoftShadowMap;
  renderer.toneMapping = T.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  host.appendChild(renderer.domElement);

  const scene = new T.Scene();
  const FOG = new T.Color('#D9EAF4');
  scene.fog = new T.Fog(FOG, 50, 290);
  const camera = new T.PerspectiveCamera(42, 1, .1, 800);

  /* ================= 小工具 ================= */
  const rnd = (() => { let s = 20260929; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
  const R = (a, b) => a + rnd() * (b - a);
  const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
  function hash(x, y) { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); }
  function noise(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  const fbm = (x, y) => noise(x, y) * .55 + noise(x * 2.1, y * 2.1) * .28 + noise(x * 4.3, y * 4.3) * .17;
  const mat = (color, o = {}) => new T.MeshStandardMaterial(Object.assign({ color, roughness: .85 }, o));
  function mesh(geo, material, cast = true, recv = true) { const m = new T.Mesh(geo, material); m.castShadow = cast; m.receiveShadow = recv; return m; }
  function glowTexture(inner = 'rgba(255,245,210,1)') {
    const c = document.createElement('canvas'); c.width = c.height = 128;
    const g = c.getContext('2d'), r = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    r.addColorStop(0, inner); r.addColorStop(.25, 'rgba(255,230,160,.55)'); r.addColorStop(1, 'rgba(255,220,140,0)');
    g.fillStyle = r; g.fillRect(0, 0, 128, 128);
    const t = new T.CanvasTexture(c); t.colorSpace = T.SRGBColorSpace; return t;
  }
  const GLOW = glowTexture();

  /* ================= 路徑與關卡位置 ================= */
  const PLAZA = new T.Vector2(0, 9), PLAZA_R = 7.5;
  const pathPts = [[0, 9], [-6, 4], [-10, -3], [-9, -11], [-2, -17], [7, -18], [14, -12], [16, -3], [13, 5]]
    .map(([x, z]) => new T.Vector3(x, 0, z));
  const curve = new T.CatmullRomCurve3(pathPts, false, 'catmullrom', .5);
  const pathSamples = curve.getSpacedPoints(160);
  function distPath(x, z) {
    let best = 1e9;
    for (let i = 0; i < pathSamples.length - 1; i++) {
      const a = pathSamples[i], b = pathSamples[i + 1];
      const abx = b.x - a.x, abz = b.z - a.z, t = Math.max(0, Math.min(1, ((x - a.x) * abx + (z - a.z) * abz) / (abx * abx + abz * abz)));
      const dx = x - (a.x + abx * t), dz = z - (a.z + abz * t); best = Math.min(best, dx * dx + dz * dz);
    }
    return Math.sqrt(best);
  }
  /* 四座道館：沿著小路，門口朝向小路 */
  const GYMS = [
    { unit: 0, at: .16, side: -1, roof: '#C8553D' },
    { unit: 1, at: .40, side: -1, roof: '#3D7DC8' },
    { unit: 2, at: .62, side: -1, roof: '#7A4FB8' },
    { unit: 3, at: .86, side: 1, roof: '#2E8B57' }
  ].map(g => {
    const p = curve.getPointAt(g.at), tan = curve.getTangentAt(g.at);
    const nrm = new T.Vector3(tan.z, 0, -tan.x).multiplyScalar(g.side);
    const pos = p.clone().add(nrm.clone().multiplyScalar(6.2));
    return Object.assign(g, { pos, door: p.clone().add(nrm.clone().multiplyScalar(2.2)), face: Math.atan2(-nrm.x, -nrm.z) });
  });
  const POND = new T.Vector2(-15, 15);

  /* 平地遮罩：小路、廣場、建築附近保持平坦 */
  const flats = GYMS.map(g => [g.pos.x, g.pos.z, 7.5]);
  const HOUSES = [[9, 16, .3], [-9, 17, -.5], [11, 2, 1.9], [-16, 6, 1.2], [22, -6, -1.9]];
  HOUSES.forEach(([x, z]) => flats.push([x, z, 5.5]));
  function height(x, z) {
    const dc = Math.hypot(x - 0, z + 4);
    let f = smooth(3, 9, distPath(x, z)) * smooth(PLAZA_R, PLAZA_R + 5, Math.hypot(x - PLAZA.x, z - PLAZA.y));
    for (const [fx, fz, fr] of flats) f *= smooth(fr * .6, fr + 3, Math.hypot(x - fx, z - fz));
    const hills = (fbm(x * .035, z * .035) - .35) * 9 * smooth(16, 55, dc) + smooth(55, 95, dc) * 14 * fbm(x * .02 + 3, z * .02);
    let h = hills * f + (fbm(x * .15, z * .15) - .5) * .35;
    const dp = Math.hypot(x - POND.x, z - POND.y);
    h -= smooth(6, 2.5, dp) * 1.2;
    return h;
  }

  /* ================= 天空、太陽、雲 ================= */
  const skyGeo = new T.SphereGeometry(500, 32, 16);
  const sky = new T.Mesh(skyGeo, new T.ShaderMaterial({
    side: T.BackSide, depthWrite: false, fog: false,
    uniforms: { top: { value: new T.Color('#5BA8F5') }, mid: { value: new T.Color('#BFE2FF') }, bot: { value: FOG } },
    vertexShader: 'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }',
    fragmentShader: 'uniform vec3 top; uniform vec3 mid; uniform vec3 bot; varying vec3 vP; void main(){ float h = vP.y; vec3 c = h > 0. ? mix(mid, top, pow(h, .6)) : bot; c = mix(bot, c, smoothstep(-.02, .12, h)); gl_FragColor = vec4(c, 1.); }'
  }));
  scene.add(sky);
  const SUN_DIR = new T.Vector3(-.55, .62, -.56).normalize();
  const sun = new T.Sprite(new T.SpriteMaterial({ map: GLOW, color: '#FFF3C4', transparent: true, blending: T.AdditiveBlending, depthWrite: false, fog: false }));
  sun.position.copy(SUN_DIR).multiplyScalar(420); sun.scale.setScalar(150); scene.add(sun);
  const sunCore = new T.Mesh(new T.SphereGeometry(10, 16, 16), new T.MeshBasicMaterial({ color: new T.Color(3, 2.8, 2.2), fog: false }));
  sunCore.position.copy(sun.position); scene.add(sunCore);

  const cloudMat = new T.MeshStandardMaterial({ color: '#FFFFFF', roughness: 1, emissive: '#DDEBFF', emissiveIntensity: .35, flatShading: true });
  const clouds = new T.Group();
  for (let i = 0; i < 9; i++) {
    const c = new T.Group();
    for (let k = 0; k < 5; k++) { const s = mesh(new T.IcosahedronGeometry(R(4, 7), 1), cloudMat, false, false); s.position.set(k * 5 - 10 + R(-1, 1), R(-1, 2), R(-2, 2)); s.scale.y = .6; c.add(s); }
    const a = i / 9 * Math.PI * 2; c.position.set(Math.cos(a) * R(130, 180), R(45, 70), Math.sin(a) * R(130, 180)); c.lookAt(0, c.position.y, 0);
    clouds.add(c);
  }
  scene.add(clouds);

  /* ================= 燈光 ================= */
  scene.add(new T.HemisphereLight('#E2F1FF', '#6E9A48', 1.45));
  const sunLight = new T.DirectionalLight('#FFF0D2', 3.1);
  sunLight.position.copy(SUN_DIR).multiplyScalar(60);
  sunLight.castShadow = true;
  sunLight.shadow.mapSize.set(2048, 2048);
  Object.assign(sunLight.shadow.camera, { left: -42, right: 42, top: 42, bottom: -42, near: 1, far: 160 });
  sunLight.shadow.bias = -.0006; sunLight.shadow.normalBias = .04; sunLight.shadow.radius = 4;
  scene.add(sunLight, sunLight.target);

  /* ================= 地形 ================= */
  const SIZE = 260, SEG = 180;
  const tg = new T.PlaneGeometry(SIZE, SIZE, SEG, SEG); tg.rotateX(-Math.PI / 2);
  const tp = tg.attributes.position, cols = [];
  const cGrassA = new T.Color('#7CC45A'), cGrassB = new T.Color('#4E9A3C'), cDry = new T.Color('#B7C66A'), cDirt = new T.Color('#A98056'), cDirt2 = new T.Color('#C49A68'), cSand = new T.Color('#D8C38E'), tmp = new T.Color();
  for (let i = 0; i < tp.count; i++) {
    const x = tp.getX(i), z = tp.getZ(i), h = height(x, z);
    tp.setY(i, h);
    const n = fbm(x * .08, z * .08);
    tmp.copy(cGrassA).lerp(cGrassB, n * .9).lerp(cDry, smooth(4, 12, h) * .5);
    const dp = distPath(x, z), dpl = Math.hypot(x - PLAZA.x, z - PLAZA.y);
    const dirt = Math.max(smooth(2.6, 1.6, dp + (noise(x * .7, z * .7) - .5) * .8), smooth(PLAZA_R + .6, PLAZA_R - .8, dpl + (noise(x * .5, z * .5) - .5) * 1.2));
    tmp.lerp(tmp.clone().copy(cDirt).lerp(cDirt2, noise(x * .9, z * .9)), dirt);
    tmp.lerp(cSand, smooth(6.5, 4.5, Math.hypot(x - POND.x, z - POND.y)) * .8);
    cols.push(tmp.r, tmp.g, tmp.b);
  }
  tg.setAttribute('color', new T.Float32BufferAttribute(cols, 3));
  tg.computeVertexNormals();
  const terrain = mesh(tg, new T.MeshStandardMaterial({ vertexColors: true, roughness: .95 }), false, true);
  scene.add(terrain);

  /* 池塘 */
  const water = mesh(new T.CircleGeometry(5.2, 40), new T.MeshStandardMaterial({ color: '#2F8FD6', roughness: .22, metalness: 0, envMapIntensity: .35, transparent: true, opacity: .9 }), false, true);
  water.rotation.x = -Math.PI / 2; water.position.set(POND.x, -.45, POND.y); scene.add(water);

  /* 遠山（雪頂） */
  const mountains = new T.Group();
  const mtnMat = new T.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 1 });
  for (let i = 0; i < 16; i++) {
    const a = i / 16 * Math.PI * 2 + R(-.1, .1), r = R(150, 200), h = R(55, 95);
    const g = new T.ConeGeometry(R(28, 42), h, 7, 4);
    const p = g.attributes.position, cc = [];
    for (let k = 0; k < p.count; k++) {
      const y = p.getY(k); p.setX(k, p.getX(k) * (1 + R(-.15, .15))); p.setZ(k, p.getZ(k) * (1 + R(-.15, .15)));
      const t = (y + h / 2) / h, c = new T.Color('#6F8FA8').lerp(new T.Color('#8FB0C0'), t);
      if (t > .72 + R(-.06, .06)) c.set('#F4F8FF');
      cc.push(c.r, c.g, c.b);
    }
    g.setAttribute('color', new T.Float32BufferAttribute(cc, 3)); g.computeVertexNormals();
    const m = mesh(g, mtnMat, false, false); m.position.set(Math.cos(a) * r, h / 2 - 6, Math.sin(a) * r); m.rotation.y = R(0, 6);
    mountains.add(m);
  }
  scene.add(mountains);

  /* ================= 可放置判斷 ================= */
  const blocked = (x, z, pad = 0) =>
    distPath(x, z) < 3 + pad || Math.hypot(x - PLAZA.x, z - PLAZA.y) < PLAZA_R + 1.5 + pad ||
    flats.some(([fx, fz, fr]) => Math.hypot(x - fx, z - fz) < fr - 1 + pad) || Math.hypot(x - POND.x, z - POND.y) < 6.5 + pad;

  /* ================= 樹林（InstancedMesh） ================= */
  const pines = [], rounds = [];
  for (let i = 0; i < 900 && (pines.length + rounds.length) < 330; i++) {
    const a = rnd() * Math.PI * 2, r = 12 + Math.pow(rnd(), .7) * 90;
    const x = Math.cos(a) * r, z = Math.sin(a) * r - 4;
    if (blocked(x, z, 1.2) || (z > 22 && Math.abs(x) < 26)) continue;
    (rnd() < .6 ? pines : rounds).push([x, height(x, z), z, R(.8, 1.5), R(0, 6)]);
  }
  function inst(geo, material, list, build) {
    const m = new T.InstancedMesh(geo, material, list.length); m.castShadow = true; m.receiveShadow = true;
    const d = new T.Object3D(), col = new T.Color();
    list.forEach((t, i) => { build(d, t, col); d.updateMatrix(); m.setMatrixAt(i, d.matrix); if (m.instanceColor !== undefined) m.setColorAt(i, col); });
    scene.add(m); return m;
  }
  const trunkMat = mat('#7A5234'), leafMat = new T.MeshStandardMaterial({ color: '#fff', flatShading: true, roughness: .9 });
  inst(new T.CylinderGeometry(.18, .28, 2, 6), trunkMat, pines.concat(rounds), (d, [x, y, z, s]) => { d.position.set(x, y + s, z); d.scale.setScalar(s); d.rotation.set(0, 0, 0); });
  [[3.2, 2.2, 2.4], [2.6, 1.7, 3.6], [2.0, 1.2, 4.7]].forEach(([h, r, off]) =>
    inst(new T.ConeGeometry(r, h, 7), leafMat, pines, (d, [x, y, z, s, rot], c) => { d.position.set(x, y + off * s, z); d.scale.setScalar(s); d.rotation.set(0, rot, 0); c.setHSL(.33 + hash(x, z) * .05, .45, .26 + hash(z, x) * .08); }));
  [[0, 3.2, 0, 1.7], [.9, 2.8, .4, 1.2], [-.7, 2.9, -.5, 1.25], [.1, 4.0, -.2, 1.1]].forEach(([ox, oy, oz, r]) =>
    inst(new T.IcosahedronGeometry(r, 1), leafMat, rounds, (d, [x, y, z, s, rot], c) => { d.position.set(x + ox * s, y + oy * s, z + oz * s); d.scale.setScalar(s); d.rotation.set(0, rot, 0); c.setHSL(.24 + hash(x, z) * .06, .55, .38 + hash(z, x) * .08); }));

  /* 草叢與小花 */
  const tufts = [], flowers = [];
  for (let i = 0; i < 9000 && tufts.length < 2600; i++) {
    const x = R(-60, 60), z = R(-60, 45);
    if (distPath(x, z) < 2.2 || Math.hypot(x - PLAZA.x, z - PLAZA.y) < PLAZA_R || Math.hypot(x - POND.x, z - POND.y) < 5.3) continue;
    tufts.push([x, height(x, z), z, R(.6, 1.3), R(0, 6)]);
    if (rnd() < .08) flowers.push([x + R(-.4, .4), height(x, z), z + R(-.4, .4), R(.8, 1.2), (rnd() * 4) | 0]);
  }
  const tuftGeo = new T.ConeGeometry(.12, .7, 3); tuftGeo.translate(0, .35, 0);
  const grassInst = inst(tuftGeo, new T.MeshStandardMaterial({ color: '#fff', roughness: 1 }), tufts, (d, [x, y, z, s, r], c) => { d.position.set(x, y, z); d.scale.set(s, s * R(.8, 1.4), s); d.rotation.set(R(-.3, .3), r, R(-.3, .3)); c.setHSL(.26 + R(0, .06), .55, .32 + R(0, .12)); });
  grassInst.castShadow = false;
  const fcol = ['#FF6B8A', '#FFD23F', '#FFFFFF', '#9B7BFF'];
  inst(new T.IcosahedronGeometry(.16, 0), new T.MeshStandardMaterial({ color: '#fff', roughness: .6 }), flowers, (d, [x, y, z, s, k], c) => { d.position.set(x, y + .55, z); d.scale.setScalar(s); c.set(fcol[k]); });

  /* 岩石 */
  const rocks = [];

  function enterGym(G) {
    if (flying) return;
    if (G.state === 'locked') { PTCG.restart(G.tag, 'nope'); toast(`先完成上一關，就能打開「${G.name}」！`); return; }
    if (!G.ready) { toast(`「${G.name}」正在製作中，敬請期待！`); return; }
    /* 鏡頭飛到道館門口，再進入關卡 */
    const face = G.face;
    flying = { t: 0, from: { ...cam, target: cam.target.clone() }, to: { az: face + Math.PI, pol: 1.2, dist: 14, target: new T.Vector3(G.pos.x, 3, G.pos.z) }, href: '../units/unit' + String(PTCG.UNITS[G.unit].no).padStart(2, '0') + '.html' };
    document.getElementById('hint').style.opacity = 0;
  }
  let hinted = false;
  function hideHint() { if (!hinted) { hinted = true; setTimeout(() => document.getElementById('hint').style.opacity = 0, 1500); } }

  /* ================= 畫質切換 ================= */
  let quality = 'high';
  const qBtn = document.getElementById('quality');
  function setQuality(q) {
    quality = q;
    renderer.shadowMap.enabled = q === 'high';
    scene.traverse(o => { if (o.material) o.material.needsUpdate = true; });
    DPR = q === 'high' ? Math.min(devicePixelRatio || 1, 1.75) : 1;
    renderer.setPixelRatio(DPR); resize();
    bloom.enabled = q === 'high';
    grassInst.visible = q === 'high';
    qBtn.textContent = '畫質：' + (q === 'high' ? '高' : '省電');
  }
  qBtn.onclick = () => setQuality(quality === 'high' ? 'low' : 'high');

  /* ================= 主迴圈 ================= */
  function resize() {
    const w = innerWidth, h = innerHeight;
    renderer.setSize(w, h); composer.setSize(w, h);
    camera.aspect = w / h;
    camera.fov = w < 640 ? 55 : 42;
    camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize); resize();

  const clock = new T.Clock();
  const v = new T.Vector3(), tmpV = new T.Vector3();
  let frames = 0, slowSum = 0, checked = false, lastT = 0;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function animateChibi(c, t, moving) {
    const { body, legs, arms } = c.userData;
    const s = moving ? Math.sin(t * 10) : 0;
    legs[0].rotation.x = s * .6; legs[1].rotation.x = -s * .6;
    arms[0].rotation.x = -s * .5; arms[1].rotation.x = s * .5;
    body.position.y = moving ? Math.abs(Math.sin(t * 10)) * .12 : Math.sin(t * 2.4) * .04;
  }

  renderer.setAnimationLoop(() => {
    const dt = Math.min(.05, clock.getDelta()), t = clock.elapsedTime;

    /* 鏡頭 */
    if (flying) {
      flying.t = Math.min(1, flying.t + dt / 1.4);
      const k = flying.t < .5 ? 2 * flying.t * flying.t : 1 - Math.pow(-2 * flying.t + 2, 2) / 2;
      let daz = flying.to.az - flying.from.az; daz = Math.atan2(Math.sin(daz), Math.cos(daz));
      cam.az = flying.from.az + daz * k; cam.pol = flying.from.pol + (flying.to.pol - flying.from.pol) * k;
      cam.dist = flying.from.dist + (flying.to.dist - flying.from.dist) * k;
      cam.target.lerpVectors(flying.from.target, flying.to.target, k);
      if (flying.t > .75) document.getElementById('fade').style.opacity = 1;
      if (flying.t >= 1 && !flying.gone) { flying.gone = true; setTimeout(() => location.href = flying.href, 350); }
    } else {
      if (!reduce && !drag) goal.az += Math.sin(t * .15) * .0004;
      cam.az += (goal.az - cam.az) * .08; cam.pol += (goal.pol - cam.pol) * .08; cam.dist += (goal.dist - cam.dist) * .08;
      cam.target.lerp(goal.target, .05);
    }
    camera.position.set(
      cam.target.x + cam.dist * Math.sin(cam.pol) * Math.sin(cam.az),
      cam.target.y + cam.dist * Math.cos(cam.pol),
      cam.target.z + cam.dist * Math.sin(cam.pol) * Math.cos(cam.az));
    camera.lookAt(cam.target);

    /* 主角走路 */
    if (!walk.done) {
      walk.t = Math.min(walk.target, walk.t + walk.speed * dt * (reduce ? 20 : 1));
      if (walk.t >= walk.target) walk.done = true;
    }
    const hp = curve.getPointAt(walk.t);
    hero.position.set(hp.x, height(hp.x, hp.z), hp.z);
    if (!walk.done) { const tan = curve.getTangentAt(walk.t); hero.rotation.y = Math.atan2(tan.x, tan.z); }
    else { const want = Math.atan2(camera.position.x - hero.position.x, camera.position.z - hero.position.z); hero.rotation.y += Math.atan2(Math.sin(want - hero.rotation.y), Math.cos(want - hero.rotation.y)) * .05; }
    animateChibi(hero, t, !walk.done);

    /* NPC 小範圍散步 */
    npcs.forEach(n => {
      const [hx, hz] = n.userData.home, ph = n.userData.phase;
      const a = t * .25 + ph, x = hx + Math.cos(a) * 1.6, z = hz + Math.sin(a * 1.3) * 1.2;
      const moving = Math.sin(t * .4 + ph) > -.3;
      if (moving) { const dx = x - n.position.x, dz = z - n.position.z; if (Math.hypot(dx, dz) > .001) n.rotation.y = Math.atan2(dx, dz); n.position.set(x, height(x, z), z); }
      animateChibi(n, t + ph, moving);
    });

    /* 道館水晶、光柱 */
    GYMS.forEach((G, i) => {
      G.crystal.rotation.y = t * .8 + i; G.crystal.position.y = 11.6 + Math.sin(t * 1.6 + i) * .35;
      if (G.pillar) { G.pillar.material.uniforms.t.value = t; G.ring.rotation.z = t * .8; G.ring.scale.setScalar(1 + Math.sin(t * 3) * .08); }
    });

    /* 光點飄動 */
    const P = mg.attributes.position;
    for (let i = 0; i < MOTES; i++) {
      const s = mseed[i];
      P.array[i * 3 + 1] += Math.sin(t * .8 + s) * .004;
      P.array[i * 3] += Math.cos(t * .3 + s) * .006;
    }
    P.needsUpdate = true;
    motes.material.uniforms.op.value = .75 + Math.sin(t * 2) * .25; motes.material.uniforms.scale.value = innerHeight * DPR * .9;
    water.material.color.setHSL(.57, .68, .5 + Math.sin(t) * .02);
    clouds.rotation.y = t * .004;

    /* 陰影跟著鏡頭目標移動 */
    sunLight.target.position.copy(cam.target);
    sunLight.position.copy(cam.target).add(tmpV.copy(SUN_DIR).multiplyScalar(60));

    composer.render(dt);

    /* 標籤位置（重疊時往上錯開） */
    const placed = [];
    GYMS.map(G => { v.set(G.pos.x, 9.6, G.pos.z).project(camera); return { G, x: (v.x * .5 + .5) * innerWidth, y: (-v.y * .5 + .5) * innerHeight, z: v.z }; })
      .sort((a, b) => b.y - a.y)
      .forEach(o => {
        const hidden = o.z > 1 || flying;
        o.G.tag.style.display = hidden ? 'none' : '';
        if (hidden) return;
        const w = o.G.tag.offsetWidth || 150, h = (o.G.tag.offsetHeight || 40) + 6;
        let y = o.y;
        for (let pass = 0; pass < 4; pass++) {
          const hit = placed.find(p => Math.abs(p.x - o.x) < (p.w + w) / 2 && Math.abs(p.y - y) < h);
          if (!hit) break;
          y = hit.y - h;
        }
        placed.push({ x: o.x, y, w });
        o.G.tag.style.transform = `translate(${o.x}px,${y}px) translate(-50%,-100%)`;
      });

    /* 前幾秒偵測效能，太慢自動降畫質 */
    if (!checked) {
      frames++;
      if (frames > 20) slowSum += dt;
      if (frames === 110) { checked = true; if (slowSum / 90 > .034) { setQuality('low'); toast('已自動切換為省電畫質'); } }
    }
    if (frames === 3) { window.__villageOK = true; const L = document.getElementById('loading'); L.style.opacity = 0; setTimeout(() => L.remove(), 800); }
  });
})();
</script>
</body>
