<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- seo -->
<meta name="description" content="寶可夢卡牌訓練營的成就徽章、每一關的星星和對戰戰績。">

<link rel="icon" type="image/png" sizes="32x32" href="assets/img/icon-32.png">
<link rel="apple-touch-icon" href="assets/img/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta property="og:type" content="website">
<meta property="og:locale" content="zh_TW">
<meta property="og:site_name" content="寶可夢卡牌訓練營">
<meta property="og:title" content="成就與戰績｜寶可夢卡牌訓練營">
<meta property="og:description" content="寶可夢卡牌訓練營的成就徽章、每一關的星星和對戰戰績。">
<meta property="og:image" content="https://planktonthai.github.io/pokemon-master/assets/img/og.png">
<meta property="og:url" content="https://planktonthai.github.io/pokemon-master/achievements.html">
<link rel="canonical" href="https://planktonthai.github.io/pokemon-master/achievements.html">

<meta name="twitter:card" content="summary_large_image">
<link rel="preload" href="assets/fonts/huninn.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/notosanstc-900.woff2" as="font" type="font/woff2" crossorigin>
<!-- /seo -->
<title>成就與戰績｜寶可夢卡牌訓練營</title>
<link rel="stylesheet" href="assets/css/style.min.css">
<style>
  .hero-stat{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
  .hs{background:#fff;border:4px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);padding:12px;text-align:center}
  .hs b{display:block;font-family:'Noto Sans TC';font-weight:900;font-size:40px;line-height:1.1}
  .hs.gold{background:linear-gradient(180deg,#FFF6C8,#FFCE3A)}
  .badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
  .badge{position:relative;text-align:center;padding:14px 8px 12px;border:3px solid var(--ink);border-radius:20px;background:#fff;box-shadow:0 5px 0 var(--ink);font-size:15px;line-height:1.4;transition:transform .25s var(--pop)}
  .badge:hover{transform:translateY(-4px) rotate(-1deg)}
  .badge .medal{width:76px;height:76px;margin:0 auto 6px;border-radius:50%;border:4px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:38px;
    background:radial-gradient(circle at 35% 30%,#FFF6C8,var(--c,#FFCE3A) 65%);box-shadow:0 4px 0 var(--ink),inset 0 -6px 0 rgba(0,0,0,.12);position:relative;overflow:hidden}
  .badge.on .medal::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.85) 50%,transparent 60%);background-size:300% 100%;animation:sheenB 3s ease-in-out infinite}
  @keyframes sheenB{0%,50%{background-position:150% 0}100%{background-position:-50% 0}}
  .badge b{display:block;font-weight:400;font-size:17px}
  .badge small{color:#5A6080}
  .badge.off{background:#EEECE6}
  .badge.off .medal{filter:grayscale(1) brightness(.85);opacity:.55}
  .badge.off b{color:#55534B}
  .badge.on::before{content:"✔";position:absolute;right:-6px;top:-8px;width:28px;height:28px;border-radius:50%;background:var(--grass);color:#fff;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:14px}
  .stars-table,.stat-table{width:100%;border-collapse:separate;border-spacing:0;border:3px solid var(--ink);border-radius:16px;overflow:hidden;background:#fff;font-size:16px}
  .stars-table td,.stars-table th,.stat-table td,.stat-table th{padding:7px 12px;border-bottom:2px solid #EAE3CF;text-align:left}
  .stars-table th,.stat-table th{background:var(--ink);color:#fff;font-weight:400}
  .stars-table tr:last-child td,.stat-table tr:last-child td{border-bottom:0}
  .st{letter-spacing:2px;color:#E0A800;-webkit-text-stroke:1px var(--ink);font-size:20px}
  .st .no{color:#D2CEC2;-webkit-text-stroke:1px #A8A498}
  .bar{height:14px;border:2px solid var(--ink);border-radius:8px;background:#F4F0E4;overflow:hidden;min-width:80px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,#5CC75A,#9BE07A)}
  .tablewrap{overflow-x:auto}
  @media (max-width:560px){ .badges{grid-template-columns:1fr 1fr;gap:10px} .badge .medal{width:60px;height:60px;font-size:30px} .hero-stat{grid-template-columns:1fr 1fr 1fr;gap:6px} .hs b{font-size:28px} .hs{padding:8px 4px;font-size:13px} }
</style>
<script src="assets/js/audio.js"></script>
<script src="assets/js/common.js"></script>
</head>
<body data-zone="grass">
<div class="wrap">
  <div class="topbar">
    <a class="btn" href="index.html">🗺 回地圖</a>
    <span class="star-pill" aria-live="polite"></span>
  </div>
  <header class="unit-head">
    <span class="tag" style="background:var(--sun);color:var(--ink)">成就</span>
    <h1>🏆 成就與戰績</h1>
    <p>看看你已經拿到多少星星、收集了哪些徽章，還有每個難度的對戰成績！</p>
  </header>
  <main>
    <div class="hero-stat" id="heroStat"></div>
    <section class="lesson"><h2><span class="no">🏅</span>徽章收藏</h2><div class="badges" id="badges"></div></section>
    <section class="lesson"><h2><span class="no">⭐</span>每一關的星星</h2><div class="tablewrap"><table class="stars-table" id="starsTable"></table></div></section>
    <section class="lesson"><h2><span class="no">⚔️</span>對戰戰績</h2><div class="tablewrap"><table class="stat-table" id="statTable"></table></div>
      <p style="margin:10px 0 0;font-size:15px">D1～D3 在「模擬對戰」選擇；D4、D5 在「終極魔王關」。</p></section>
  </main>
</div>
<script>
(() => {
  PTCG.clouds();
  PTCG.starPill(document.querySelector('.star-pill'));
  const U = PTCG.UNITS, st = id => PTCG.getStars(id), stats = PTCG.getStats(), beaten = PTCG.bossBeaten();
  const zoneDone = z => U.filter(u => u.zone === z && /^u\d/.test(u.id)).every(u => st(u.id) > 0);
  const lessons = U.filter(u => /^u\d/.test(u.id));
  const wins = Object.values(stats.won).reduce((a, b) => a + b, 0), played = Object.values(stats.played).reduce((a, b) => a + b, 0);
  const total = PTCG.totalStars(), max = U.length * 3;
  document.getElementById('heroStat').innerHTML = `
    <div class="hs gold"><b>${total}</b>/ ${max} 顆星星</div>
    <div class="hs"><b>${lessons.filter(u => st(u.id) > 0).length}</b>/ ${lessons.length} 關完成</div>
    <div class="hs"><b>${wins}</b>/ ${played} 場勝利</div>`;
  const B = [
    ['🌱', '草原畢業', '完成第 1～4 關', zoneDone('grass'), '#9BE08E'],
    ['🏜️', '山谷畢業', '完成第 5～8 關', zoneDone('canyon'), '#FFC98A'],
    ['🌋', '火山畢業', '完成第 9～10 關', zoneDone('volcano'), '#FF9A8A'],
    ['💯', '完美學霸', '第 1～10 關全部三星', lessons.every(u => st(u.id) === 3), '#B6E3FF'],
    ['⭐', '星星收藏家', '收集 20 顆星星', total >= 20, '#FFE680'],
    ['⚔️', '第一場勝利', '在對戰中贏一場', wins >= 1, '#FFB08A'],
    ['🔥', '館主殺手', '打贏 D3 道館館主', (stats.won[3] || 0) >= 1, '#FF8A6A'],
    ['🎖️', '百戰勇者', '完成 10 場對戰', played >= 10, '#C9B8A6'],
    ...PTCG.BOSSES.map(b => [b.icon, '擊敗' + b.name.replace('終極魔王・', ''), `終極魔王關第 ${b.no} 戰`, beaten >= b.no, b.color]),
    ['👑', '卡牌大師', '打敗全部五位魔王', beaten >= 5, '#D9B8FF']
  ];
  document.getElementById('badges').innerHTML = B.map(([ic, nm, how, on, c]) => `<div class="badge ${on ? 'on' : 'off'}" style="--c:${c}" aria-label="${nm}：${on ? '已獲得' : '尚未獲得'}"><div class="medal" aria-hidden="true">${on ? ic : '?'}</div><b>${nm}</b><small>${how}</small></div>`).join('');
  const zn = { grass: '🌱 草原', canyon: '🏜️ 山谷', volcano: '🌋 火山' };
  const stars = n => '★'.repeat(n) + `<span class="no">${'★'.repeat(3 - n)}</span>`;
  document.getElementById('starsTable').innerHTML = '<thead><tr><th>區域</th><th>關卡</th><th>星星</th></tr></thead><tbody>' + U.map(u => `<tr><td>${zn[u.zone]}</td><td>${u.no} ${u.name}</td><td class="st" aria-label="${st(u.id)} 顆星">${stars(st(u.id))}</td></tr>`).join('') + '</tbody>';
  const LV = ['D1 見習生', 'D2 訓練家', 'D3 道館館主', 'D4 四天王', 'D5 終極魔王'];
  document.getElementById('statTable').innerHTML = '<thead><tr><th>對手強度</th><th>場數</th><th>勝場</th><th>勝率</th></tr></thead><tbody>' + LV.map((n, i) => {
    const p = stats.played[i + 1] || 0, w = stats.won[i + 1] || 0, r = p ? Math.round(w / p * 100) : 0;
    return `<tr><td>${n}</td><td>${p}</td><td>${w}</td><td><div style="display:flex;align-items:center;gap:8px"><div class="bar"><i style="width:${r}%"></i></div>${p ? r + '%' : '—'}</div></td></tr>`;
  }).join('') + '</tbody>';
})();
</script>
</body>
</html>
