<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>寶可夢卡牌訓練營</title>
<meta name="description" content="給小學生的寶可夢卡牌遊戲教學，從新手到高手一步步學。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏡</text></svg>">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  html,body{height:100%;overflow:hidden;background:#BFE3FF}
  #world{position:fixed;inset:0;touch-action:none}
  #world canvas{display:block;width:100%;height:100%}
  .hud{position:fixed;left:0;right:0;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;pointer-events:none}
  .hud > *{pointer-events:auto}
  .zone-pill{
    font-family:'Noto Sans TC',var(--round);font-weight:900;font-size:22px;
    background:linear-gradient(180deg,#B9F0A8,#6BC25A);border:3px solid var(--ink);border-radius:16px;
    padding:4px 16px;box-shadow:0 5px 0 var(--ink),0 0 18px rgba(255,255,255,.7);color:var(--ink)
  }
  .hint{
    position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:10;
    background:rgba(31,42,92,.82);color:#fff;border-radius:14px;padding:6px 16px;font-size:15px;white-space:nowrap;
    transition:opacity .6s
  }
  .quality{position:fixed;right:46px;bottom:12px;z-index:11;font-size:14px;padding:6px 12px}
  .zone-nav{position:fixed;left:14px;bottom:14px;z-index:11;display:flex;gap:8px}
  .zone-nav .btn{font-size:15px;padding:6px 12px}
  .zone-pill.canyon{background:linear-gradient(180deg,#FFD9A8,#F3A04C)} .zone-pill.volcano{background:linear-gradient(180deg,#FFB8A8,#E8604C);color:#fff;text-shadow:0 2px 0 var(--ink)}
  .gym-tag.soon::after{content:"製作中";font-size:11px;background:var(--ink);color:#fff;border-radius:6px;padding:0 5px;margin-left:2px}
  @media (max-width:560px){ .zone-nav .btn{font-size:13px;padding:5px 8px} .hint{bottom:64px} }
  /* 道館標籤（HTML 文字，保持清晰） */
  #tags{position:fixed;inset:0;z-index:5;pointer-events:none}
  .gym-tag{
    position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;
    display:flex;align-items:center;gap:8px;white-space:nowrap;
    background:#fff;border:3px solid var(--ink);border-radius:16px;padding:4px 12px 4px 4px;
    box-shadow:0 5px 0 var(--ink);font-family:inherit;font-size:17px;color:var(--ink);
    transform:translate(-50%,-100%);will-change:transform;transition:filter .2s
  }
  .gym-tag b{
    display:inline-flex;width:32px;height:32px;border-radius:50%;align-items:center;justify-content:center;
    background:var(--sun);border:3px solid var(--ink);font-family:'Noto Sans TC';font-weight:900;font-size:17px
  }
  .gym-tag i{font-style:normal;font-size:14px;letter-spacing:1px}
  .gym-tag.current{background:linear-gradient(180deg,#FFF6C8,#FFE066);animation:tagGlow 1.4s ease-in-out infinite}
  .gym-tag.locked{background:#E9E6DD;color:#6F6C62}
  .gym-tag.locked b{background:#D2CEC2}
  .gym-tag:hover{filter:brightness(1.08)}
  .gym-tag.nope{animation:nope .35s}
  @keyframes tagGlow{50%{box-shadow:0 5px 0 var(--ink),0 0 22px 8px rgba(255,230,128,.95)}}
  .loading{
    position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:radial-gradient(circle at 50% 40%,#E9F7FF,#9ED3FF);transition:opacity .8s
  }
  .loading .spin{width:64px;height:64px;border-radius:50%;border:6px solid #fff;border-top-color:var(--sun);animation:spin 1s linear infinite}
  .loading p{font-size:20px;margin:0}
  .fade{position:fixed;inset:0;z-index:25;background:#fff;opacity:0;pointer-events:none;transition:opacity .6s}
  @media (max-width:560px){ .zone-pill{font-size:18px} .gym-tag{font-size:15px} .hint{font-size:13px} }
</style>
</head>
<body>
<div id="world" aria-label="新手草原 3D 村莊地圖"></div>
<div id="tags"></div>

<div class="hud topbar">
  <div style="display:flex;gap:10px;align-items:center">
    <a class="btn" href="map.html" aria-label="平面地圖" title="平面地圖">🗺</a>
    <span class="zone-pill" id="zonePill">🌱 新手草原</span>
  </div>
  <span class="star-pill" aria-live="polite"></span>
</div>
<div class="zone-nav" id="zoneNav">
  <button class="btn" data-z="grass">🌱 草原</button><button class="btn" data-z="canyon">🏜️ 山谷</button><button class="btn" data-z="volcano">🌋 火山</button>
</div>
<div class="hint" id="hint">拖曳可以轉動視角・滾輪或雙指縮放・點道館進入關卡</div>
<button class="btn quality" id="quality">畫質：高</button>
<div class="toast" id="toast" role="status"></div>
<div class="fade" id="fade"></div>
<div class="loading" id="loading"><div class="spin"></div><p>訓練營世界建造中…</p></div>

<script>
  /* 載入檢查：資源缺少或出錯時顯示說明，不要一直轉圈 */
  (function(){
    function fail(msg){
      var L=document.getElementById('loading'); if(!L) return;
      L.innerHTML='<p style="font-size:22px;margin:0 0 8px">😵 村莊載入失敗</p><p style="max-width:420px;text-align:center;line-height:1.7;font-size:17px;margin:0 16px">'+msg+'</p>';
    }
    window.__villageFail = fail;
    window.addEventListener('error', function(e){
      if (e.target && (e.target.tagName==='SCRIPT' || e.target.tagName==='LINK')) fail('找不到網站的程式檔。請先把 zip「全部解壓縮」，再打開資料夾裡的 prototype/village.html；，再打開 index.html。');
      else if (e.message) fail('發生錯誤：'+e.message+'<br>可以改開 village-standalone.html 試試看。');
    }, true);
    setTimeout(function(){ if(document.getElementById('loading') && !window.__villageOK) fail('等太久了。請確認已經解壓縮整個資料夾，，再打開 index.html。'); }, 20000);
  })();
</script>
<script src="assets/vendor/three.min.js"></script>
<script src="assets/vendor/three-post.js"></script>
<script src="assets/js/partners3d.js"></script>
<script src="assets/js/audio.js"></script>
<script src="assets/js/common.js"></script>
<script>
(() => {
  if (typeof THREE === 'undefined' || typeof PTCG === 'undefined') { window.__villageFail && __villageFail('找不到網站的程式檔。請先把 zip「全部解壓縮」，再打開資料夾裡的 prototype/village.html；，再打開 index.html。'); return; }
  if (!document.createElement('canvas').getContext('webgl2') && !document.createElement('canvas').getContext('webgl')) { location.replace('map.html'); return; }
  const T = THREE;
  PTCG.starPill(document.querySelector('.star-pill'));
  PTCG.cheatButton();

  /* ================= 基本設定 ================= */
  const host = document.getElementById('world');
  const renderer = new T.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  let DPR = Math.min(devicePixelRatio || 1, 1.75);
  renderer.setPixelRatio(DPR);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = T.PCFSoftShadowMap;
  renderer.toneMapping = T.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  host.appendChild(renderer.domElement);

  const scene = new T.Scene();
  const FOG = new T.Color('#D9EAF4');
  scene.fog = new T.Fog(FOG, 50, 290);
  const camera = new T.PerspectiveCamera(42, 1, .1, 800);

  /* ================= 小工具 ================= */
  const rnd = (() => { let s = 20260929; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
  const R = (a, b) => a + rnd() * (b - a);
  const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
  function hash(x, y) { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); }
  function noise(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  const fbm = (x, y) => noise(x, y) * .55 + noise(x * 2.1, y * 2.1) * .28 + noise(x * 4.3, y * 4.3) * .17;
  const mat = (color, o = {}) => new T.MeshStandardMaterial(Object.assign({ color, roughness: .85 }, o));
  function mesh(geo, material, cast = true, recv = true) { const m = new T.Mesh(geo, material); m.castShadow = cast; m.receiveShadow = recv; return m; }
  function glowTexture(inner = 'rgba(255,245,210,1)') {
    const c = document.createElement('canvas'); c.width = c.height = 128;
    const g = c.getContext('2d'), r = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    r.addColorStop(0, inner); r.addColorStop(.25, 'rgba(255,230,160,.55)'); r.addColorStop(1, 'rgba(255,220,140,0)');
    g.fillStyle = r; g.fillRect(0, 0, 128, 128);
    const t = new T.CanvasTexture(c); t.colorSpace = T.SRGBColorSpace; return t;
  }
  const GLOW = glowTexture();

  /* ================= 路徑與關卡位置 ================= */
  const PLAZA = new T.Vector2(0, 9), PLAZA_R = 7.5;
  const pathPts = [[0, 9], [-6, 4], [-10, -3], [-9, -11], [-2, -17], [8, -17], [16, -12], [24, -8], [34, -8], [44, -12], [52, -20], [58, -30], [54, -40], [46, -46], [44, -56], [50, -64], [50, -74], [42, -82], [34, -88], [26, -96], [30, -106], [40, -110]]
    .map(([x, z]) => new T.Vector3(x, 0, z));
  const curve = new T.CatmullRomCurve3(pathPts, false, 'catmullrom', .5);
  const pathSamples = curve.getSpacedPoints(360);
  function distPath(x, z) {
    let best = 1e9;
    for (let i = 0; i < pathSamples.length - 1; i++) {
      const a = pathSamples[i], b = pathSamples[i + 1];
      if (Math.abs(a.x - x) > 14 && Math.abs(b.x - x) > 14 || Math.abs(a.z - z) > 14 && Math.abs(b.z - z) > 14) { const q = Math.min(Math.hypot(a.x - x, a.z - z), Math.hypot(b.x - x, b.z - z)); best = Math.min(best, q * q); continue; }
      const abx = b.x - a.x, abz = b.z - a.z, t = Math.max(0, Math.min(1, ((x - a.x) * abx + (z - a.z) * abz) / (abx * abx + abz * abz)));
      const dx = x - (a.x + abx * t), dz = z - (a.z + abz * t); best = Math.min(best, dx * dx + dz * dz);
    }
    return Math.sqrt(best);
  }
  function tNear(x, z) { let best = 1e9, bi = 0; pathSamples.forEach((p, i) => { const d = (p.x - x) ** 2 + (p.z - z) ** 2; if (d < best) { best = d; bi = i; } }); return bi / (pathSamples.length - 1); }
  const ZONE_C = { grass: new T.Vector3(2, 0, -5), canyon: new T.Vector3(52, 0, -36), volcano: new T.Vector3(34, 0, -98) };
  const zoneW = (x, z) => ({ c: smooth(44, 26, Math.hypot(x - 52, z + 36)) * smooth(-80, -66, z), v: Math.max(smooth(46, 26, Math.hypot(x - 34, z + 100)), smooth(-68, -82, z)) });
  /* 11 個關卡：草原 4、山谷 4、火山 2 + 對戰競技場 */
  const GYMS = [
    { unit: 0, x: -16, z: 2, roof: '#C8553D', zone: 'grass' }, { unit: 1, x: -17, z: -13, roof: '#3D7DC8', zone: 'grass' },
    { unit: 2, x: 2, z: -25, roof: '#7A4FB8', zone: 'grass' }, { unit: 3, x: 20, z: -19, roof: '#2E8B57', zone: 'grass' },
    { unit: 4, x: 40, z: -21, roof: '#D2691E', zone: 'canyon' }, { unit: 5, x: 67, z: -25, roof: '#B8860B', zone: 'canyon' },
    { unit: 6, x: 63, z: -47, roof: '#A0522D', zone: 'canyon' }, { unit: 7, x: 35, z: -58, roof: '#CD5C5C', zone: 'canyon' },
    { unit: 8, x: 57, z: -84, roof: '#5A1E1E', zone: 'volcano' }, { unit: 9, x: 21, z: -86, roof: '#3A2A2A', zone: 'volcano' },
    { unit: 10, x: 37, z: -122, roof: '#8B0000', zone: 'volcano', arena: true }
  ].map(g => {
    const at = tNear(g.x, g.z), p = curve.getPointAt(at), pos = new T.Vector3(g.x, 0, g.z);
    const dir = new T.Vector3(p.x - g.x, 0, p.z - g.z).normalize();
    return Object.assign(g, { at, pos, door: pos.clone().add(dir.clone().multiplyScalar(g.arena ? 7 : 4.2)), face: Math.atan2(dir.x, dir.z) });
  });
  const POND = new T.Vector2(-15, 15);

  /* 平地遮罩：小路、廣場、建築附近保持平坦 */
  const flats = GYMS.map(g => [g.pos.x, g.pos.z, g.arena ? 11 : 7.5]);
  const HOUSES = [[9, 16, .3], [-9, 17, -.5], [11, 2, 1.9], [-16, 12, 1.2], [28, 1, -1.9], [58, -11, 2.4, 'canyon'], [65, -37, -1.6, 'canyon'], [40, -40, 1.2, 'canyon'], [49, -97, -.9, 'volcano'], [19, -106, 1.1, 'volcano']];
  HOUSES.forEach(([x, z]) => flats.push([x, z, 5.5]));
  function height(x, z) {
    let f = smooth(3, 10, distPath(x, z)) * smooth(PLAZA_R, PLAZA_R + 5, Math.hypot(x - PLAZA.x, z - PLAZA.y));
    for (const [fx, fz, fr] of flats) f *= smooth(fr * .6, fr + 3, Math.hypot(x - fx, z - fz));
    const w = zoneW(x, z), dw = Math.hypot(x - 25, z + 55);
    const hills = (fbm(x * .035, z * .035) - .35) * 8 * (1 - w.c * .75) * (1 + w.v * .6) * smooth(6, 30, distPath(x, z));
    const edge = smooth(80, 130, dw) * 22 * fbm(x * .02 + 3, z * .02);
    let h = (hills + edge) * f + (fbm(x * .15, z * .15) - .5) * .35;
    h -= smooth(6, 2.5, Math.hypot(x - POND.x, z - POND.y)) * 1.2;
    return h;
  }

  /* ================= 天空、太陽、雲 ================= */
  const skyGeo = new T.SphereGeometry(500, 32, 16);
  const sky = new T.Mesh(skyGeo, new T.ShaderMaterial({
    side: T.BackSide, depthWrite: false, fog: false,
    uniforms: { top: { value: new T.Color('#5BA8F5') }, mid: { value: new T.Color('#BFE2FF') }, bot: { value: FOG } },
    vertexShader: 'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }',
    fragmentShader: 'uniform vec3 top; uniform vec3 mid; uniform vec3 bot; varying vec3 vP; void main(){ float h = vP.y; vec3 c = h > 0. ? mix(mid, top, pow(h, .6)) : bot; c = mix(bot, c, smoothstep(-.02, .12, h)); gl_FragColor = vec4(c, 1.); }'
  }));
  scene.add(sky);
  const SUN_DIR = new T.Vector3(-.55, .62, -.56).normalize();
  const sun = new T.Sprite(new T.SpriteMaterial({ map: GLOW, color: '#FFF3C4', transparent: true, blending: T.AdditiveBlending, depthWrite: false, fog: false }));
  sun.position.copy(SUN_DIR).multiplyScalar(420); sun.scale.setScalar(150); scene.add(sun);
  const sunCore = new T.Mesh(new T.SphereGeometry(10, 16, 16), new T.MeshBasicMaterial({ color: new T.Color(3, 2.8, 2.2), fog: false }));
  sunCore.position.copy(sun.position); scene.add(sunCore);

  const cloudMat = new T.MeshStandardMaterial({ color: '#FFFFFF', roughness: 1, emissive: '#DDEBFF', emissiveIntensity: .35, flatShading: true });
  const clouds = new T.Group();
  for (let i = 0; i < 9; i++) {
    const c = new T.Group();
    for (let k = 0; k < 5; k++) { const s = mesh(new T.IcosahedronGeometry(R(4, 7), 1), cloudMat, false, false); s.position.set(k * 5 - 10 + R(-1, 1), R(-1, 2), R(-2, 2)); s.scale.y = .6; c.add(s); }
    const a = i / 9 * Math.PI * 2; c.position.set(Math.cos(a) * R(130, 180), R(45, 70), Math.sin(a) * R(130, 180)); c.lookAt(0, c.position.y, 0);
    clouds.add(c);
  }
  scene.add(clouds);

  /* ================= 燈光 ================= */
  scene.add(new T.HemisphereLight('#E2F1FF', '#6E9A48', 1.45));
  const sunLight = new T.DirectionalLight('#FFF0D2', 3.1);
  sunLight.position.copy(SUN_DIR).multiplyScalar(60);
  sunLight.castShadow = true;
  sunLight.shadow.mapSize.set(2048, 2048);
  Object.assign(sunLight.shadow.camera, { left: -42, right: 42, top: 42, bottom: -42, near: 1, far: 160 });
  sunLight.shadow.bias = -.0006; sunLight.shadow.normalBias = .04; sunLight.shadow.radius = 4;
  scene.add(sunLight, sunLight.target);

  /* ================= 地形 ================= */
  const SIZE = 330, SEG = 210;
  const tg = new T.PlaneGeometry(SIZE, SIZE, SEG, SEG); tg.rotateX(-Math.PI / 2); tg.translate(25, 0, -55);
  const tp = tg.attributes.position, cols = [];
  const cGrassA = new T.Color('#7CC45A'), cGrassB = new T.Color('#4E9A3C'), cDry = new T.Color('#B7C66A'), cDirt = new T.Color('#A98056'), cDirt2 = new T.Color('#C49A68'), cSand = new T.Color('#D8C38E'), tmp = new T.Color();
  const cCan1 = new T.Color('#E6B77A'), cCan2 = new T.Color('#CF8A55'), cCanPath = new T.Color('#F2D2A2'), cVol1 = new T.Color('#4A3E3C'), cVol2 = new T.Color('#6A574F'), cVolPath = new T.Color('#8E7A6C');
  for (let i = 0; i < tp.count; i++) {
    const x = tp.getX(i), z = tp.getZ(i), h = height(x, z);
    tp.setY(i, h);
    const n = fbm(x * .08, z * .08), w = zoneW(x, z);
    tmp.copy(cGrassA).lerp(cGrassB, n * .9).lerp(cDry, smooth(4, 12, h) * .5);
    if (w.c > 0) tmp.lerp(cCan1.clone().lerp(cCan2, noise(x * .12, z * .12)), w.c);
    if (w.v > 0) tmp.lerp(cVol1.clone().lerp(cVol2, noise(x * .15, z * .15)), w.v);
    const dp = distPath(x, z), dpl = Math.hypot(x - PLAZA.x, z - PLAZA.y);
    const dirt = Math.max(smooth(2.6, 1.6, dp + (noise(x * .7, z * .7) - .5) * .8), smooth(PLAZA_R + .6, PLAZA_R - .8, dpl + (noise(x * .5, z * .5) - .5) * 1.2));
    const dc = cDirt.clone().lerp(cDirt2, noise(x * .9, z * .9)).lerp(cCanPath, w.c).lerp(cVolPath, w.v);
    tmp.lerp(dc, dirt);
    tmp.lerp(cSand, smooth(6.5, 4.5, Math.hypot(x - POND.x, z - POND.y)) * .8);
    cols.push(tmp.r, tmp.g, tmp.b);
  }
  tg.setAttribute('color', new T.Float32BufferAttribute(cols, 3));
  tg.computeVertexNormals();
  const terrain = mesh(tg, new T.MeshStandardMaterial({ vertexColors: true, roughness: .95 }), false, true);
  scene.add(terrain);

  /* 池塘 */
  const water = mesh(new T.CircleGeometry(5.2, 40), new T.MeshStandardMaterial({ color: '#2F8FD6', roughness: .22, metalness: 0, envMapIntensity: .35, transparent: true, opacity: .9 }), false, true);
  water.rotation.x = -Math.PI / 2; water.position.set(POND.x, -.45, POND.y); scene.add(water);

  /* 遠山（雪頂） */
  const mountains = new T.Group();
  const mtnMat = new T.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 1 });
  for (let i = 0; i < 16; i++) {
    const a = i / 16 * Math.PI * 2 + R(-.1, .1), r = R(175, 225), h = R(60, 100);
    const g = new T.ConeGeometry(R(28, 42), h, 7, 4);
    const p = g.attributes.position, cc = [];
    for (let k = 0; k < p.count; k++) {
      const y = p.getY(k); p.setX(k, p.getX(k) * (1 + R(-.15, .15))); p.setZ(k, p.getZ(k) * (1 + R(-.15, .15)));
      const t = (y + h / 2) / h, c = new T.Color('#6F8FA8').lerp(new T.Color('#8FB0C0'), t);
      if (t > .72 + R(-.06, .06)) c.set('#F4F8FF');
      cc.push(c.r, c.g, c.b);
    }
    g.setAttribute('color', new T.Float32BufferAttribute(cc, 3)); g.computeVertexNormals();
    const m = mesh(g, mtnMat, false, false); m.position.set(25 + Math.cos(a) * r, h / 2 - 6, -55 + Math.sin(a) * r); m.rotation.y = R(0, 6);
    mountains.add(m);
  }
  scene.add(mountains);

  /* ================= 可放置判斷 ================= */
  const blocked = (x, z, pad = 0) =>
    distPath(x, z) < 3 + pad || Math.hypot(x - PLAZA.x, z - PLAZA.y) < PLAZA_R + 1.5 + pad ||
    flats.some(([fx, fz, fr]) => Math.hypot(x - fx, z - fz) < fr - 1 + pad) || Math.hypot(x - POND.x, z - POND.y) < 6.5 + pad;

  /* ================= 樹林（InstancedMesh） ================= */
  const pines = [], rounds = [];

    /* 目前所在區域 */
    let zn = 'grass', zd = 1e9; for (const k in ZONE_C) { const d = cam.target.distanceTo(ZONE_C[k]); if (d < zd) { zd = d; zn = k; } }
    if (zonePill.dataset.z !== zn) { zonePill.dataset.z = zn; zonePill.className = 'zone-pill ' + zn; zonePill.textContent = { grass: '🌱 新手草原', canyon: '🏜️ 進階山谷', volcano: '🌋 高手火山' }[zn]; if (typeof PTCGAudio !== 'undefined') PTCGAudio.music(zn === 'canyon' ? 'bgm_canyon' : 'bgm_grassland'); }
    /* 標籤位置（重疊時往上錯開） */
    const placed = [];
    GYMS.map(G => { v.set(G.pos.x, G.arena ? 12 : 9.6, G.pos.z).project(camera); return { G, x: (v.x * .5 + .5) * innerWidth, y: (-v.y * .5 + .5) * innerHeight, z: v.z }; })
      .sort((a, b) => b.y - a.y)
      .forEach(o => {
        const hidden = o.z > 1 || flying || o.G.pos.distanceTo(cam.target) > 62;
        o.G.tag.style.display = hidden ? 'none' : '';
        if (hidden) return;
        const w = o.G.tag.offsetWidth || 150, h = (o.G.tag.offsetHeight || 40) + 6;
        let y = o.y;
        for (let pass = 0; pass < 4; pass++) {
          const hit = placed.find(p => Math.abs(p.x - o.x) < (p.w + w) / 2 && Math.abs(p.y - y) < h);
          if (!hit) break;
          y = hit.y - h;
        }
        placed.push({ x: o.x, y, w });
        o.G.tag.style.transform = `translate(${o.x}px,${y}px) translate(-50%,-100%)`;
      });

    /* 前幾秒偵測效能，太慢自動降畫質 */
    if (!checked) {
      frames++;
      if (frames > 20) slowSum += dt;
      if (frames === 110) { checked = true; if (slowSum / 90 > .034) { setQuality('low'); toast('已自動切換為省電畫質'); } }
    }
    if (frames === 3) { window.__villageOK = true; const L = document.getElementById('loading'); L.style.opacity = 0; setTimeout(() => L.remove(), 800); }
  });
})();
</script>
