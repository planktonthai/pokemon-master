<title>模擬對戰｜寶可夢卡牌訓練營</title>
<link rel="stylesheet" href="../assets/css/style.min.css">
<style>
  body{background:radial-gradient(ellipse at 50% 45%,#5A3A3A 0%,#2E1E2A 60%,#1E1420 100%) fixed}
  .wrap{max-width:1180px;padding:10px 12px calc(var(--dock-h,170px) + 16px)}
  .topbar{gap:8px}
  .topbar h1{margin:0;font-family:'Noto Sans TC';font-weight:900;font-size:24px;color:var(--sun);-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;flex:1;text-align:center}
  .tb-right{display:flex;gap:8px;align-items:center}
  #board{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:12px;align-items:start}

  /* ===== 對戰地墊 ===== */
  .arena{position:relative;border:4px solid var(--ink);border-radius:26px;box-shadow:0 8px 0 var(--ink),0 30px 50px -20px rgba(0,0,0,.6);overflow:hidden;
    background:
      radial-gradient(circle at 50% 50%,rgba(255,255,255,.10) 0 64px,transparent 65px),
      radial-gradient(circle at 50% 50%,transparent 0 58px,rgba(255,255,255,.35) 58px 61px,transparent 61px),
      linear-gradient(180deg,#34488F 0%,#2B3C7A 49.6%,var(--ink) 49.6% 50.4%,#B64B33 50.4%,#9C3C2A 100%)}
  .arena::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(circle at 1.5px 1.5px,rgba(255,255,255,.07) 1.5px,transparent 2px) 0 0/14px 14px}
  .side{position:relative;display:grid;grid-template-columns:76px minmax(0,1fr) 76px;gap:10px;padding:12px 14px;align-items:center}
  #ai{padding-bottom:18px} #me{padding-top:18px}
  .who{grid-column:1/-1;display:flex;align-items:center;gap:8px;color:#fff;font-size:15px;text-shadow:0 2px 0 var(--ink)}
  .who .tag{background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.4);border-radius:12px;padding:0 10px}
  .who .fan{display:flex;margin-left:4px}
  .who .fan i{width:14px;height:20px;margin-left:-6px;border-radius:3px;border:2px solid var(--ink);background:radial-gradient(circle,#FFCE3A 22%,#2A3A8C 27%)}
  .who .fan i:first-child{margin-left:0}
  #ai .who{order:-1}
  .zones{display:flex;flex-direction:column;gap:10px;align-items:center;min-width:0}
  #ai .zones{flex-direction:column-reverse}
  .active{display:flex;justify-content:center;position:relative}
  .active::before{content:"";position:absolute;inset:-8px -14px;border-radius:18px;border:2px dashed rgba(255,255,255,.35);pointer-events:none}
  .arena{--bw:clamp(62px,calc((100vh - 400px) / 6.3),92px)}
  .bench{display:grid;grid-template-columns:repeat(5,minmax(0,var(--bw)));gap:8px;width:100%;justify-content:center}
  .piles,.prizes{display:flex;flex-direction:column;gap:8px;align-items:center}
  .pile{position:relative;width:64px;aspect-ratio:5/7;border-radius:9px;border:3px solid var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:3px;color:#fff;font-size:11px;text-shadow:0 1px 0 var(--ink)}
  .pile b{font-family:'Noto Sans TC';font-weight:900;font-size:18px;line-height:1}
  .pile.deck{background:radial-gradient(circle at 50% 38%,#FFCE3A 0 16%,transparent 17%),radial-gradient(circle at 50% 50%,#3B5BDB,#1A2466 80%);box-shadow:2px 2px 0 #1A2466,4px 4px 0 var(--ink)}
  .pile.discard{background:rgba(255,255,255,.12);border-style:dashed;border-color:rgba(255,255,255,.55)}
  .pile.discard.has{background:linear-gradient(160deg,#fff,#E9E4D6);color:var(--ink);text-shadow:none;border-style:solid;border-color:var(--ink)}
  .prizes .grid{display:grid;grid-template-columns:repeat(2,26px);gap:4px}
  .pz{width:26px;height:36px;border-radius:5px;border:2px solid var(--ink);background:radial-gradient(circle at 50% 46%,#FFCE3A 0 18%,transparent 20%),radial-gradient(circle,#3B5BDB,#1A2466 85%);box-shadow:0 2px 0 var(--ink)}
  .pz.gone{background:rgba(255,255,255,.1);border:2px dashed rgba(255,255,255,.35);box-shadow:none}
  .prizes em,.piles em{font-style:normal;color:#fff;font-size:12px;text-shadow:0 1px 0 var(--ink);white-space:nowrap}

  /* ===== 場上的卡（與教學卡同一套卡框） ===== */
  :where(.bc,.hc){--tc:#E8E4DA;--tl:#FAF8F3;--td:#5A5648}
  .bc{container-type:inline-size;position:relative;width:100%;max-width:var(--bw,92px);aspect-ratio:5/7;border:3px solid var(--ink);border-radius:11px;padding:4px;cursor:pointer;
    background:linear-gradient(145deg,color-mix(in srgb,var(--tc) 45%,#fff),var(--tc) 25%,color-mix(in srgb,var(--tc) 62%,#1F2A5C) 50%,var(--tc) 72%,color-mix(in srgb,var(--tc) 35%,#fff));
    box-shadow:0 4px 0 var(--ink);transition:transform .3s var(--pop),box-shadow .3s}
  .bc .in{height:100%;border:2px solid var(--ink);border-radius:7px;background:linear-gradient(172deg,#fff,var(--tl) 40%);display:flex;flex-direction:column;gap:3%;padding:4% 5%;overflow:hidden}
  .bc:hover{transform:translateY(-3px)}
  .bc.empty{background:rgba(255,255,255,.08);border:2px dashed rgba(255,255,255,.4);box-shadow:none;cursor:default;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.65);font-size:13px}
  .bc.empty:hover{transform:none}
  .active .bc{max-width:calc(var(--bw) * 1.28);width:calc(var(--bw) * 1.28)}
  .bc.ex{background:linear-gradient(125deg,#FFC7EE,#FFF2A6 20%,#B9FFE6 40%,#B5D2FF 60%,#E2BDFF 80%,#FFC7EE);box-shadow:0 4px 0 var(--ink),0 0 14px 2px rgba(255,236,170,.75)}
  .bc-name{font-size:clamp(8px,15cqw,14px);line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bc-name .exmark{-webkit-text-stroke:1.5px var(--ink)}
  .bc-stg{font-size:clamp(7px,10cqw,10px);opacity:.75;line-height:1}
  .bc-art{flex:1;min-height:0;border:2px solid var(--ink);border-radius:5px;display:flex;align-items:center;justify-content:center;
    background:repeating-conic-gradient(from 0deg at 50% 64%,rgba(255,255,255,.25) 0 10deg,transparent 10deg 20deg),radial-gradient(circle at 50% 60%,color-mix(in srgb,var(--tc) 30%,#fff),var(--tc) 60%,color-mix(in srgb,var(--tc) 70%,#1F2A5C));
    font-family:'Noto Sans TC';font-weight:900;font-size:clamp(14px,30cqw,34px);color:#fff;-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill}
  .bc.ex .bc-art{background:repeating-linear-gradient(115deg,rgba(255,111,216,.35) 0 5px,rgba(255,230,109,.35) 5px 10px,rgba(111,255,210,.35) 10px 15px,rgba(111,179,255,.35) 15px 20px),radial-gradient(circle at 50% 60%,color-mix(in srgb,var(--tc) 30%,#fff),var(--tc) 60%,color-mix(in srgb,var(--tc) 70%,#1F2A5C))}
  .bc-hp{position:relative;height:clamp(9px,13cqw,14px);border:2px solid var(--ink);border-radius:6px;background:#fff;overflow:hidden;flex:none}
  .bc-hp i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#4FB34E,#8FE07A);transition:width .6s}
  .bc-hp i.low{background:linear-gradient(90deg,#E8453C,#FF9A7A)}
  .bc-hp span{position:relative;display:block;text-align:center;font-size:clamp(7px,9cqw,10px);line-height:1}
  .bc-en{display:flex;flex-wrap:wrap;gap:1px;min-height:clamp(10px,15cqw,17px);flex:none}
  .bc-en .en{width:clamp(10px,15cqw,16px);height:clamp(10px,15cqw,16px);font-size:clamp(6px,8cqw,9px);border-width:1.5px}
  .bc-dmg{position:absolute;top:30%;left:50%;transform:translateX(-50%);background:radial-gradient(circle at 35% 30%,#FF9AA2,#E8453C);color:#fff;border:2px solid var(--ink);border-radius:12px;padding:0 6px;font-size:12px;box-shadow:0 2px 0 var(--ink)}
  .bc-mk{position:absolute;right:-9px;top:-9px;display:flex;flex-direction:column;gap:2px;z-index:3}
  .bc-mk .mk{width:24px;height:24px;font-size:11px;border-width:2px}
  .bc-mk .mk.st{background:#fff;color:var(--ink)}
  .bc.st-sleep{transform:rotate(-12deg)} .bc.st-para{transform:rotate(12deg)} .bc.st-conf{transform:rotate(180deg)}
  .bc.arrive{animation:arrive .5s var(--pop)} @keyframes arrive{0%{transform:scale(1.25);filter:brightness(1.6)}100%{transform:none}}
  .lunge-up{animation:lu .5s var(--pop)} @keyframes lu{40%{transform:translateY(-50px) scale(1.1)}}
  .lunge-down{animation:ld .5s var(--pop)} @keyframes ld{40%{transform:translateY(50px) scale(1.1)}}
  .bc .dmg-pop{top:20%;font-size:34px}
  body.my-turn #me .active .bc:not(.empty){box-shadow:0 4px 0 var(--ink),0 0 0 4px rgba(255,230,120,.9),0 0 22px 6px rgba(255,214,90,.55)}

  /* ===== 右側面板 ===== */
  .panel{display:flex;flex-direction:column;gap:8px;position:sticky;top:10px}
  #turnInfo{color:#fff;font-size:17px;text-align:center;text-shadow:0 2px 0 var(--ink)}
  #hint{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:6px 10px;font-size:15px;min-height:40px;line-height:1.45}
  #endTurn{justify-content:center;font-size:20px}
  #endTurn:disabled{opacity:.5;cursor:not-allowed}
  #log{background:#FFFBF0;border:4px solid var(--ink);border-radius:18px;padding:8px;height:min(420px,calc(100vh - 360px));min-height:180px;overflow-y:auto;font-size:14px;line-height:1.5;box-shadow:0 6px 0 var(--ink)}
  .lg{padding:3px 4px;border-bottom:1px dashed #D8CFB8}
  .lg.big{background:#FFF1C0;border-radius:8px}
  .lg.turn{text-align:center;color:#8A5A2A}
  #logBtn{display:none}

  /* ===== 手牌抽屜 ===== */
  #dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:linear-gradient(180deg,rgba(31,42,92,0),rgba(31,42,92,.94) 22px);padding:22px 10px calc(10px + env(safe-area-inset-bottom))}
  #dock .bar{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:8px}
  #dock .lbl{color:#fff;font-size:14px;margin:0 0 0 4px;flex:1}
  #handToggle{font-size:13px;padding:3px 12px}
  #hand{display:flex;gap:8px;overflow-x:auto;padding:8px 4px 6px;max-width:1180px;margin:0 auto;scroll-snap-type:x proximity;overscroll-behavior-x:contain}
  #dock.collapsed #hand{display:none}
  .hc{container-type:inline-size;flex:none;width:84px;aspect-ratio:5/7;border:3px solid var(--ink);border-radius:11px;padding:3px;font-family:inherit;color:var(--ink);cursor:pointer;scroll-snap-align:start;
    background:linear-gradient(145deg,color-mix(in srgb,var(--tc) 45%,#fff),var(--tc) 25%,color-mix(in srgb,var(--tc) 62%,#1F2A5C) 50%,var(--tc) 72%,color-mix(in srgb,var(--tc) 35%,#fff));
    box-shadow:0 4px 0 var(--ink);transition:transform .2s var(--pop)}
  .hc .in{height:100%;border:2px solid var(--ink);border-radius:7px;background:linear-gradient(172deg,#fff,var(--tl) 40%);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:4px 2px}
  .hc:hover{transform:translateY(-10px)}
  .hc .k{font-size:10px;opacity:.8;line-height:1.1}
  .hc b{font-family:'Noto Sans TC';font-weight:900;font-size:24px;color:#fff;-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;width:88%;border-radius:6px;border:2px solid var(--ink);text-align:center;line-height:1.3;
    background:repeating-conic-gradient(from 0deg at 50% 64%,rgba(255,255,255,.25) 0 10deg,transparent 10deg 20deg),var(--tc)}
  .hc.energy b{flex:1;display:flex;align-items:center;justify-content:center;border-radius:50%;width:auto;aspect-ratio:1;margin:4px 0;font-size:26px;
    background:radial-gradient(circle at 34% 28%,#fff 0 8%,color-mix(in srgb,var(--tc) 40%,#fff) 16%,var(--tc) 55%,color-mix(in srgb,var(--tc) 65%,#1F2A5C))}
  .hc small{font-size:12px;text-align:center;line-height:1.2}
  .hc.trainer{--tc:#6E8BC4;--tl:#EEF2FA}.hc.trainer.sup{--tc:#EE8A4A;--tl:#FFF1E6}
  .hc.trainer b{font-size:28px;-webkit-text-stroke:0;background:repeating-conic-gradient(from 0deg at 50% 64%,rgba(255,255,255,.25) 0 10deg,transparent 10deg 20deg),color-mix(in srgb,var(--tc) 55%,#fff)}
  .hc.ex{background:linear-gradient(125deg,#FFC7EE,#FFF2A6 20%,#B9FFE6 40%,#B5D2FF 60%,#E2BDFF 80%,#FFC7EE);box-shadow:0 4px 0 var(--ink),0 0 10px 3px rgba(255,236,170,.8)}
  .hc.drawn{animation:drawn .55s var(--pop) both} @keyframes drawn{from{transform:translate(-40px,-60px) rotate(-14deg) scale(.5);opacity:0}}
  body:not(.my-turn) .hc{filter:saturate(.6) brightness(.9);cursor:default}
  body:not(.my-turn) .hc:hover{transform:none}
  .fly{position:fixed;top:0;left:0;z-index:40;pointer-events:none;margin:0;transform-origin:0 0}

  /* ===== 對話框與硬幣 ===== */
  #modal{position:fixed;inset:0;z-index:50;background:rgba(20,20,40,.55);display:none;align-items:center;justify-content:center;padding:16px}
  #modal.show{display:flex}
  #modal .box{background:#FFFBF0;border:4px solid var(--ink);border-radius:22px;box-shadow:0 8px 0 var(--ink);padding:16px;max-width:520px;width:100%;max-height:92vh;overflow:auto;text-align:center}
  #modal h2{margin:6px 0 12px;font-weight:400;font-size:21px}
  #modal .mcard{display:flex;justify-content:center;margin:14px 0 8px}
  #modal .mcard .pcard{animation:none !important}
  #modal .logbox{text-align:left;max-height:60vh;overflow:auto;font-size:14px;line-height:1.5}
  .opts2{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
  .opts2 .btn{justify-content:center;flex-direction:column;gap:0;line-height:1.35}
  .opts2 .btn small{font-size:13px;opacity:.85}
  .opts2 .btn:disabled{opacity:.55;cursor:not-allowed;background:#EEE}
  #coin{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(20,20,40,.35);pointer-events:none}
  #coin.show{display:flex}
  #coin p{color:#fff;font-size:22px;text-shadow:0 2px 0 var(--ink);margin:0}

  /* ===== 平板與手機 ===== */
  @media (max-width:900px){
    #board{grid-template-columns:1fr}
    .panel{position:fixed;top:auto;left:0;right:0;bottom:var(--hand-h,128px);z-index:21;flex-direction:row;align-items:center;gap:6px;padding:6px 10px;
      background:rgba(31,42,92,.94);border-top:3px solid var(--ink)}
    #turnInfo{display:none}
    #hint{flex:1;min-height:0;font-size:13px;padding:4px 8px;border-width:2px;line-height:1.35}
    #endTurn{font-size:15px;padding:6px 12px;white-space:nowrap}
    #log{display:none}
    #logBtn{display:inline-flex;font-size:15px;padding:6px 10px}
    #dock{padding-top:6px;background:rgba(31,42,92,.97)}
  }
  @media (max-width:600px){
    .wrap{padding:6px 6px calc(var(--dock-h,190px) + 10px)}
    .topbar h1{font-size:18px}
    .topbar .btn{padding:4px 10px;font-size:14px}
    .topbar .star-pill{font-size:14px;padding:3px 10px}
    .arena{border-radius:18px;border-width:3px}
    .side{grid-template-columns:minmax(0,1fr);gap:6px;padding:8px}
    #ai{padding-bottom:12px} #me{padding-top:12px}
    .piles,.prizes{flex-direction:row;gap:6px}
    .who{flex-wrap:wrap;font-size:13px;gap:6px}
    .piles,.prizes{display:none}
    .side .who .mini-stat{display:inline-flex}
    .bench{gap:5px;grid-template-columns:repeat(5,minmax(0,1fr))}
    .arena{--bw:62px}
    .active .bc{width:80px}
    .active::before{inset:-5px -8px}
    .hc{width:66px}
    .hc b{font-size:18px}
    .hc small{font-size:10px}
    #dock .lbl{font-size:12px}
  }
  @media (max-width:600px){ .hide-s{display:none} }
  .who .mini-stat{display:none;align-items:center;gap:3px;background:rgba(0,0,0,.18);border-radius:10px;padding:0 7px;font-size:12px}
  .who .mini-stat .pz{width:10px;height:14px;border-width:1.5px;border-radius:2px;box-shadow:none}
  .who .mini-stat .pz.gone{opacity:.35}
</style>
</head>
<body data-bgm="bgm_battle" data-zone="volcano">
<div class="wrap">
  <div class="topbar">
    <a class="btn" href="../index.html?zone=volcano" aria-label="回地圖">🗺 <span class="hide-s">回地圖</span></a>
    <h1>⚔️ 模擬對戰</h1>
    <div class="tb-right"><span class="star-pill" aria-live="polite"></span></div>
  </div>
  <div id="board">
    <div class="arena">
      <section class="side" id="ai" aria-label="電腦的場地">
        <div class="who"></div>
        <div class="piles"></div>
        <div class="zones"><div class="active"></div><div class="bench"></div></div>
        <div class="prizes"></div>
      </section>
      <section class="side" id="me" aria-label="你的場地">
        <div class="prizes"></div>
        <div class="zones"><div class="active"></div><div class="bench"></div></div>
        <div class="piles"></div>
        <div class="who"></div>
      </section>
    </div>
    <aside class="panel">
      <div id="turnInfo"></div>
      <div id="hint" aria-live="polite"></div>
      <button class="btn" id="logBtn" aria-label="對戰紀錄">📜</button>
      <button class="btn berry" id="endTurn">✅ 結束回合</button>
      <div id="log" aria-live="polite"></div>
    </aside>
  </div>
</div>
<div id="dock">
  <div class="bar"><p class="lbl">🃏 你的手牌<span class="hide-s">：點一張卡來使用・點你的戰鬥寶可夢來攻擊或撤退</span></p><button class="btn" id="handToggle" aria-expanded="true">收起 ▾</button></div>
  <div id="hand"></div>
</div>
<div id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle"></div>
<div id="coin" aria-hidden="true"><div class="coin">?</div><p></p></div>

<script src="../assets/js/audio.js"></script>
<script src="../assets/js/common.js"></script>
<script>PTCG.starPill(document.querySelector('.star-pill'));</script>
<script src="../assets/js/battle.js"></script>
</body>
</html>
