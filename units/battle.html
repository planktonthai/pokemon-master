<title>模擬對戰｜寶可夢卡牌訓練營</title>
<link rel="stylesheet" href="../assets/css/style.min.css?v=fd4d826b">
<style>
  body{background:linear-gradient(180deg,#2A1E2E,#4A2A2A 40%,#6A3A2A)}
  .wrap{max-width:1100px;padding:10px 10px calc(var(--hand-h,170px) + 24px);position:relative;z-index:1}
  .topbar h1{margin:0;font-family:'Noto Sans TC';font-weight:900;font-size:24px;color:var(--sun);-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill}
  #board{display:grid;grid-template-columns:1fr 240px;gap:10px}
  .field{display:flex;flex-direction:column;gap:8px}
  .side{border:4px solid var(--ink);border-radius:22px;padding:8px 10px;box-shadow:0 6px 0 var(--ink);display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center}
  #ai{background:linear-gradient(180deg,#5A6FB8,#3D4E8C)}
  #me{background:linear-gradient(0deg,#E8783D,#C8553D)}
  .side .info{grid-column:1/3;justify-self:start;color:#fff;font-size:15px;background:rgba(20,24,60,.72);border-radius:10px;padding:1px 10px}
  .side .row{display:flex;gap:8px;align-items:center;justify-content:center}
  .side .bench{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;flex:1}
  .side .active{display:flex;justify-content:center;min-width:130px}
  .side .prizes{display:grid;grid-template-columns:repeat(3,16px);gap:3px;align-content:center;color:#fff;font-size:12px;text-align:center}
  .side .prizes em{grid-column:1/4;font-style:normal;white-space:nowrap}
  .pz{width:16px;height:22px;border-radius:3px;border:2px solid var(--ink);background:radial-gradient(circle,#FFCE3A 25%,#2A3A8C 30%)}
  #ai .main{display:flex;flex-direction:column-reverse;gap:8px}
  #me .main{display:flex;flex-direction:column;gap:8px}
  /* 場上的卡 */
  :where(.bc,.hc){--tc:#E8E4DA;--tl:#FAF8F3}
  .bc{position:relative;width:100%;max-width:104px;aspect-ratio:5/7;border:3px solid var(--ink);border-radius:10px;background:linear-gradient(160deg,#fff,var(--tl) 40%);box-shadow:0 4px 0 var(--ink);padding:3px;display:flex;flex-direction:column;gap:2px;font-size:11px;line-height:1.2;cursor:pointer;transition:transform .3s var(--pop)}
  .bc:hover{transform:translateY(-3px)}
  .bc.empty{background:rgba(255,255,255,.12);border-style:dashed;box-shadow:none;cursor:default;align-items:center;justify-content:center;color:rgba(255,255,255,.6);font-size:13px}
  .active .bc{max-width:128px;width:128px;font-size:12px}
  .bc.ex{box-shadow:0 4px 0 var(--ink),0 0 12px 3px rgba(255,236,150,.9)}
  .bc-top{display:flex;flex-direction:column}
  .bc-top .stg{font-size:9px;opacity:.8}
  .bc-top b{font-weight:400;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bc-art{flex:1;border:2px solid var(--ink);border-radius:6px;background:var(--tc);display:flex;align-items:center;justify-content:center;font-family:'Noto Sans TC';font-weight:900;font-size:26px;color:#fff;-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;min-height:26px}
  .bc-hp{position:relative;height:13px;border:2px solid var(--ink);border-radius:6px;background:#fff;overflow:hidden}
  .bc-hp i{position:absolute;inset:0 auto 0 0;background:#5CC75A;transition:width .6s}
  .bc-hp i.low{background:#FF5E6C}
  .bc-hp span{position:relative;display:block;text-align:center;font-size:9px;line-height:9px}
  .bc-en{display:flex;flex-wrap:wrap;gap:1px;min-height:18px}
  .bc-en .en{width:16px;height:16px;font-size:9px}
  .bc-dmg{position:absolute;top:34%;left:50%;transform:translateX(-50%);background:radial-gradient(circle at 35% 30%,#FF9AA2,#E8453C);color:#fff;border:2px solid var(--ink);border-radius:12px;padding:0 6px;font-size:12px}
  .bc-mk{position:absolute;right:-8px;top:-8px;display:flex;flex-direction:column;gap:2px}
  .bc-mk .mk{width:26px;height:26px;font-size:12px}
  .bc-mk .mk.st{background:#fff;color:var(--ink)}
  .bc.st-sleep{transform:rotate(-12deg)} .bc.st-para{transform:rotate(12deg)} .bc.st-conf{transform:rotate(180deg)}
  .lunge-up{animation:lu .5s var(--pop)} @keyframes lu{40%{transform:translateY(-50px) scale(1.1)}}
  .lunge-down{animation:ld .5s var(--pop)} @keyframes ld{40%{transform:translateY(50px) scale(1.1)}}
  .bc .dmg-pop{top:20%;font-size:34px}
  /* 右側 */
  .panel{display:flex;flex-direction:column;gap:8px}
  #log{background:#FFFBF0;border:4px solid var(--ink);border-radius:18px;padding:8px;height:420px;overflow-y:auto;font-size:14px;line-height:1.5;box-shadow:0 6px 0 var(--ink)}
  .lg{padding:3px 4px;border-bottom:1px dashed #D8CFB8}
  .lg.big{background:#FFF1C0;border-radius:8px}
  .lg.turn{text-align:center;color:#8A5A2A}
  #hint{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:6px 10px;font-size:15px;min-height:40px}
  #turnInfo{color:#fff;font-size:17px;text-align:center;text-shadow:0 2px 0 var(--ink)}
  #endTurn{justify-content:center;font-size:20px}
  #endTurn:disabled{opacity:.5;cursor:not-allowed}
  /* 手牌 */
  #handBar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:linear-gradient(180deg,rgba(31,42,92,.0),rgba(31,42,92,.92) 30%);padding:26px 10px 10px}
  #handBar .lbl{color:#fff;font-size:14px;margin:0 0 4px 6px}
  #hand{display:flex;gap:8px;overflow-x:auto;padding:6px 4px 8px;max-width:1100px;margin:0 auto}
  .hc{flex:none;width:84px;height:118px;border:3px solid var(--ink);border-radius:10px;background:linear-gradient(160deg,#fff,var(--tl) 45%);box-shadow:0 4px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:4px 2px;font-family:inherit;color:var(--ink);cursor:pointer;transition:transform .2s var(--pop)}
  .hc:hover{transform:translateY(-10px)}
  .hc .k{font-size:10px;opacity:.8}
  .hc b{font-family:'Noto Sans TC';font-weight:900;font-size:26px;color:#fff;-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;background:var(--tc);width:90%;border-radius:6px;border:2px solid var(--ink);text-align:center}
  .hc.energy b.big{flex:1;display:flex;align-items:center;justify-content:center}
  .hc small{font-size:12px;text-align:center;line-height:1.2}
  .hc.trainer{--tl:#EEF1F5}.hc.trainer b{background:#fff;font-size:30px;-webkit-text-stroke:0}
  .hc.trainer.sup{--tl:#FFE9D6}
  .hc.ex{box-shadow:0 4px 0 var(--ink),0 0 10px 3px rgba(255,236,150,.9)}
  body:not(.my-turn) .hc{filter:saturate(.6) brightness(.9);cursor:default}
  body:not(.my-turn) .hc:hover{transform:none}
  /* 對話框與硬幣 */
  #modal{position:fixed;inset:0;z-index:50;background:rgba(20,20,40,.55);display:none;align-items:center;justify-content:center;padding:16px}
  #modal.show{display:flex}
  #modal .box{background:#FFFBF0;border:4px solid var(--ink);border-radius:22px;box-shadow:0 8px 0 var(--ink);padding:16px;max-width:520px;width:100%;max-height:92vh;overflow:auto;text-align:center}
  #modal h2{margin:6px 0 12px;font-weight:400;font-size:21px;line-height:1.5}
  #modal .mcard{display:flex;justify-content:center;margin-bottom:6px}
  #modal .mcard .pcard{animation:none !important}
  .opts2{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
  .opts2 .btn{justify-content:center;flex-direction:column;gap:0;line-height:1.35}
  .opts2 .btn small{font-size:13px;opacity:.85}
  .opts2 .btn[aria-disabled=true],.opts2 .btn:disabled{cursor:not-allowed;background:#ECEAE4;color:#4A4840;border-style:dashed;box-shadow:0 3px 0 #8A877C}
  #coin{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(20,20,40,.35);pointer-events:none}
  #coin.show{display:flex}
  #coin p{color:#fff;font-size:22px;text-shadow:0 2px 0 var(--ink);margin:0}
  @media (max-width:820px){
    #board{grid-template-columns:1fr}
    #log{height:170px}
    .active .bc{width:104px}
    .side{padding:6px}
  }
  #oppBadge{background:linear-gradient(180deg,#3A2A4A,#1F1430);color:#fff;border:3px solid var(--ink);border-radius:16px;padding:8px 12px;box-shadow:0 5px 0 var(--ink),0 0 18px rgba(176,113,224,.55);font-size:22px;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
  #oppBadge b{font-weight:400;font-size:18px}
  #oppBadge small{flex-basis:100%;font-size:13px;color:#FFD9A8}
  /* ===== 第 2 輪：3D 競技場桌面 ===== */
  #arena3d{position:fixed;inset:0;z-index:0}
  #arena3d canvas{display:block}
  body.has-arena{background:#1E1428}
  body.has-arena .sky-deco{display:none}
  .side{backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  body.has-arena #ai{background:linear-gradient(180deg,rgba(90,111,184,.82),rgba(61,78,140,.78))}
  body.has-arena #me{background:linear-gradient(0deg,rgba(232,120,61,.86),rgba(200,85,61,.8))}
  body.boss-mode #ai{background:linear-gradient(180deg,rgba(90,40,130,.86),rgba(50,20,80,.82));box-shadow:0 6px 0 var(--ink),0 0 30px rgba(176,113,224,.55)}
  body.final-boss #oppBadge{animation:bossPulse 1.6s ease-in-out infinite}
  @keyframes bossPulse{50%{box-shadow:0 5px 0 var(--ink),0 0 34px 10px rgba(176,113,224,.85)}}
  @media (min-width:821px){
    .field{transform:perspective(1600px) rotateX(6deg);transform-origin:50% 100%}
    .side .main,#ai .main,#me .main{display:grid !important;grid-template-columns:136px 1fr;align-items:center;gap:12px}
    #ai .main{direction:rtl} #ai .main > *{direction:ltr}
    .side .bench .bc{max-width:96px}
  }
  body.has-arena #ai{background:linear-gradient(180deg,rgba(90,111,184,.66),rgba(61,78,140,.6))}
  body.has-arena #me{background:linear-gradient(0deg,rgba(232,120,61,.7),rgba(200,85,61,.62))}
  body.boss-mode #ai{background:linear-gradient(180deg,rgba(90,40,130,.7),rgba(50,20,80,.66))}
  #turnInfo{background:rgba(31,42,92,.7);border-radius:12px;padding:4px 8px}
  /* 手牌抽屜 */
  #handBar{padding:10px 10px 8px;background:linear-gradient(180deg,rgba(20,16,40,.55),rgba(20,16,40,.94) 40%);border-top:3px solid rgba(255,206,58,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .hand-toggle{display:flex;align-items:center;gap:8px;width:100%;max-width:1100px;margin:0 auto 2px;background:none;border:0;color:#fff;font-size:15px;cursor:pointer;padding:2px 6px;text-align:left}
  .hand-toggle small{opacity:.75;font-size:13px}
  @media (max-width:560px){ .hand-toggle small{display:none} .topbar{flex-wrap:wrap;row-gap:6px} .topbar h1{font-size:18px;order:3;flex-basis:100%;text-align:center} }
  .hand-toggle b{margin-left:auto;font-size:20px;transition:transform .3s}
  #handBar.closed .hand-toggle b{transform:rotate(180deg)}
  #handBar.closed #hand{display:none}
  #handCount{background:var(--sun);color:var(--ink);border:2px solid var(--ink);border-radius:10px;padding:0 8px;font-size:13px}
  body.my-turn #handBar{border-top-color:#FFCE3A;box-shadow:0 -6px 24px rgba(255,206,58,.35)}
  /* 閃卡：ex 與超級進化 ex */
  .bc,.hc{overflow:hidden}
  .bc.ex::after,.hc.ex::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:8px;mix-blend-mode:overlay;opacity:.75;
    background:linear-gradient(125deg,#ff6fd8 0%,#ffe66d 20%,#6fffd2 40%,#6fb3ff 60%,#c86fff 80%,#ff6fd8 100%);background-size:300% 300%;animation:foil 5s linear infinite}
  .bc.ex::before,.hc.ex::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.75) 50%,transparent 60%);background-size:300% 100%;animation:sheen 3.5s ease-in-out infinite}
  .bc.mega{border-color:#5A1E8C;box-shadow:0 4px 0 var(--ink),0 0 16px 5px rgba(176,113,224,.9)}
  .bc.mega .bc-top b::after{content:" ★";color:#B071E0}
  @keyframes foil{to{background-position:300% 300%}}
  @keyframes sheen{0%,40%{background-position:150% 0}100%{background-position:-50% 0}}
  .hc{position:relative}
  .hc:hover{transform:translateY(-12px) rotate(-2deg);box-shadow:0 10px 0 var(--ink),0 0 18px rgba(255,236,150,.8)}
  .bc .bc-mk,.bc .bc-dmg,.bc .dmg-pop{z-index:3}
  @media (prefers-reduced-motion:reduce){ .bc.ex::after,.hc.ex::after,.bc.ex::before,.hc.ex::before{animation:none} }
</style>
</head>
<body data-bgm="bgm_battle" data-zone="volcano">
<div class="wrap">
  <nav class="topbar" aria-label="網站導覽">
    <a class="btn" href="../index.html?zone=volcano" id="backBtn">🗺 回地圖</a>
    <h1 id="pageTitle">⚔️ 模擬對戰</h1>

  </nav>
  <div id="board">
    <div class="field">
      <section class="side" id="ai" aria-label="電腦的場地">
        <div class="info"></div>
        <div class="main"><div class="row"><div class="active"></div></div><div class="bench"></div></div>
        <div class="prizes"></div>
      </section>
      <section class="side" id="me" aria-label="你的場地">
        <div class="main"><div class="row"><div class="active"></div></div><div class="bench"></div></div>

        <div class="info"></div>
      </section>
    </div>
    <aside class="panel">
      <div id="oppBadge" hidden></div>

      <div id="log" aria-live="polite"></div>
    </aside>
  </div>
</div>
<div id="handBar"><button class="hand-toggle" id="handToggle" aria-expanded="true" aria-controls="hand">🃏 你的手牌 <span id="handCount"></span><small>（點卡片使用・點戰鬥寶可夢攻擊或撤退）</small><b aria-hidden="true">▾</b></button><div id="hand"></div></div>
<div id="modal" role="dialog" aria-modal="true"></div>
<div id="coin" aria-hidden="true"><div class="coin">?</div><p></p></div>
